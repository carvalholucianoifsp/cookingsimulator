<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Desafio do Gestor · Gestão Express</title>
<style>
:root{--ink:#26213a;--or:#ff6b35;--tl:#17b3a3;--yl:#ffc933;--pp:#6c4bff;--rd:#e63946;--gr:#2a9d4f;--paper:#fff6dd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#26213a;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;color:var(--ink);user-select:none}
button{font:inherit;cursor:pointer}
#app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;padding:8px;background:#26213a}
.hud{display:flex;gap:8px;align-items:stretch}
.k{flex:1;background:var(--paper);border-radius:14px;padding:6px 12px;border-bottom:5px solid var(--yl)}
.k small{display:block;font-size:12px;opacity:.7}.k b{font-size:22px}.k.t{background:var(--pp);color:#fff;border-color:#bba9ff;flex:.7;text-align:center}
.k.neg b{color:var(--rd)}
#snd{background:var(--paper);border:0;border-radius:14px;font-size:22px;padding:0 14px}
#phase{color:#ffe9a8;font-weight:700;text-align:center;font-size:15px}
main{display:grid;grid-template-columns:270px 1fr 230px;gap:8px;min-height:0}
.panel{background:var(--paper);border-radius:16px;padding:10px;overflow:auto}.panel h2{margin:0 0 8px;font-size:17px}
#kitchen{position:relative;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;background:repeating-conic-gradient(#ffd98a 0 25%,#ffcf6e 0 50%) 0 0/48px 48px;overflow:hidden}
#banner{min-height:34px;border-radius:10px;padding:6px 10px;font-weight:700;background:rgba(255,255,255,.65);text-align:center}
#banner.ev{background:var(--rd);color:#fff;animation:sh .5s 2}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#stations{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.st{background:#fff;border:4px solid #fff;border-radius:16px;padding:8px;text-align:center;box-shadow:0 5px 0 #c98d2e;cursor:pointer}
.st .e{font-size:44px}.st b{display:block}.st small{display:block;min-height:16px}
.st.hl{border-color:var(--or);animation:pu .8s infinite}.st.sk{border-color:var(--rd);background:#ffe3e3}
@keyframes pu{50%{transform:scale(1.05)}}
.st.pick{outline:4px dashed var(--pp)}
#lane{position:relative;height:170px;flex:none}
.wk{position:absolute;width:21%;transition:left .6s,top .6s;transform:translateX(-50%);background:#fff;border:4px solid var(--c);border-radius:16px;padding:6px;text-align:center;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.wk.sel{outline:5px solid var(--pp);animation:pu .7s infinite}
.wk .av{font-size:34px;display:inline-block;background:var(--c);border-radius:50%;width:50px;height:50px;line-height:50px}
.wk.on .av{animation:bo .4s infinite}@keyframes bo{50%{transform:translateY(-5px)}}
.wk b{display:block;font-size:14px}.wk small{display:block;font-size:12px;min-height:30px}
.pb{height:8px;background:#e5dcc3;border-radius:5px;overflow:hidden}.pb i{display:block;height:100%;background:var(--gr);width:0}
#counter{margin-top:auto;background:#8a5a2b;color:#fff;border-radius:14px;padding:10px;font-size:20px;text-align:center;border-bottom:6px solid #5b3a18}
.pop{position:absolute;font-weight:900;font-size:26px;pointer-events:none;animation:up 1.2s forwards;text-shadow:0 2px 0 #fff}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.oc{background:#fff;border:3px solid #eadfb8;border-radius:14px;padding:8px;margin-bottom:8px;cursor:pointer}
.oc.sel{border-color:var(--pp);box-shadow:0 0 0 3px #d8cfff}.oc.late{background:#ffe3e3;border-color:var(--rd)}
.it{font-size:28px;margin-right:4px;opacity:.35;filter:grayscale(1)}.it.ok{opacity:1;filter:none}
.mt{display:flex;justify-content:space-between;font-size:13px;margin:4px 0}
.go{width:100%;border:0;border-radius:10px;padding:6px;font-weight:800;background:#c9c2dd;color:#fff}.go.rdy{background:var(--gr);animation:pu .8s infinite}
.tip{background:var(--pp);color:#fff;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;margin-bottom:8px}
.sr{display:grid;grid-template-columns:34px 1fr;gap:3px 8px;align-items:center;padding:8px;border-radius:12px;margin-bottom:8px;background:#fff;border:3px solid #eadfb8}
.sr .em{font-size:28px;grid-row:span 2}.sr .nm{font-size:14px;font-weight:700;display:flex;justify-content:space-between}.sr .q{font-size:18px;font-weight:900}
.sr .bar{height:8px;background:#e5dcc3;border-radius:5px;overflow:hidden}.sr .bar i{display:block;height:100%;background:var(--gr)}
.sr.lo{border-color:var(--yl);background:#fff7d1}.sr.z{border-color:var(--rd);background:#ffd5d5}
.sr .wn{grid-column:1/3;font-size:12px;font-weight:800;color:var(--rd)}
.sr button{grid-column:1/3;border:0;border-radius:10px;background:var(--tl);color:#fff;font-weight:800;padding:7px;font-size:13px;box-shadow:0 3px 0 #0f7f73}.sr.lo button,.sr.z button{background:var(--or);box-shadow:0 3px 0 #b3431a;animation:pu .7s infinite}.sr button.no{background:#b9b3c9;box-shadow:none;animation:none}
.rc{font-size:13px;font-weight:700;color:#7a4b00;background:#fff3cf;border-radius:8px;padding:2px 4px;margin:3px 0}
.opt{display:flex;gap:8px;justify-content:center;margin:8px 0}.opt button{border:3px solid var(--pp);background:#fff;color:var(--pp);border-radius:12px;padding:8px 16px;font-weight:800;font-size:17px}.opt button.on{background:var(--pp);color:#fff}
.hlogo{height:54px;background:#fff;border-radius:12px;padding:3px;align-self:center}
#rst{background:var(--paper);border:0;border-radius:14px;font-weight:800;padding:0 14px}
.rk{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;margin:8px 0}.rk td{padding:7px 10px;border-bottom:1px solid #eee;text-align:left}.rk td:last-child{text-align:right;font-weight:800}.rk tr.me{background:#fff0b8;font-weight:800}


#cash{float:right;font-size:14px;background:var(--yl);border-radius:8px;padding:2px 8px}
#hint{background:var(--yl);border-radius:14px;padding:10px 14px;font-weight:800;text-align:center;font-size:17px}#hint.bad{background:var(--rd);color:#fff}
.ov{position:fixed;inset:0;background:rgba(38,33,58,.93);display:none;align-items:center;justify-content:center;padding:14px;overflow:auto}
.ov.on{display:flex}.card{background:var(--paper);border-radius:22px;max-width:760px;width:100%;padding:22px 26px;text-align:center;border-bottom:8px solid var(--or)}
.card h1{margin:0 0 6px;font-size:32px;color:var(--or)}.card h2{margin:8px 0}.card p{margin:6px 0}
.big{border:0;border-radius:14px;background:var(--or);color:#fff;font-weight:900;font-size:20px;padding:12px 26px;margin:8px 6px;box-shadow:0 5px 0 #b3431a}.big.alt{background:var(--pp);box-shadow:0 5px 0 #4228b8}
.rep{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.rep div{background:#fff;border-radius:12px;padding:6px}.rep b{display:block;font-size:19px}.rep small{font-size:12px}
.dec{text-align:left;background:#fff;border-radius:12px;padding:8px 12px;margin:6px 0;border-left:6px solid var(--tl)}
.chips span{display:inline-block;background:var(--pp);color:#fff;border-radius:20px;padding:4px 12px;margin:3px;font-size:14px}
@media(max-width:1000px){main{grid-template-columns:220px 1fr 200px}.st .e{font-size:32px}}
button,.st,.wk,.oc{touch-action:manipulation}
@media(max-width:900px){
html,body{height:auto;min-height:100%}
#app{height:auto;min-height:100vh;display:flex;flex-direction:column;gap:6px;padding:6px}
.hud{flex-wrap:wrap;gap:5px;position:sticky;top:0;z-index:6;background:#26213a;padding:2px 0 4px}
.k{flex:1 1 22%;min-width:0;padding:3px 6px;border-bottom-width:3px;border-radius:10px}.k small{font-size:10px}.k b{font-size:14px;white-space:nowrap}
.k.t{flex:1 1 30%}.k.t b{font-size:18px}
#snd,#rst{flex:0 0 auto;padding:4px 10px;font-size:15px;border-radius:10px}
#phase{font-size:13px}
main{display:flex;flex-direction:column;gap:8px}
.panel{overflow:visible}
#olist{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.oc{flex:0 0 185px;margin:0}
#stations{grid-template-columns:1fr 1fr;gap:8px}.st .e{font-size:34px}.st{padding:6px}
#lane{display:grid;grid-template-columns:1fr 1fr;gap:8px;height:auto}
.wk{position:static;width:auto;transform:none}
#counter{font-size:16px;margin-top:0}
#slist{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sr{margin:0}
#hint{position:sticky;bottom:0;z-index:6;font-size:14px;padding:7px 10px}
.hlogo{display:none}.ov{align-items:flex-start}.card{padding:14px;margin:auto}.card h1{font-size:23px}.rep{grid-template-columns:1fr 1fr}.big{font-size:17px;padding:10px 16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="app">
<div class="hud"><img class="hlogo" id="hl" alt="IFSP Campus Boituva"><div class="k"><small>Faturamento</small><b id="kf">R$ 0,00</b></div><div class="k" id="kl"><small>Lucro</small><b id="kp">R$ 0,00</b></div><div class="k"><small>Satisfação</small><b id="ks">70%</b></div><div class="k"><small>Produtividade</small><b id="kd">0 pedidos</b></div><div class="k t"><small>Tempo</small><b id="kt">4:00</b></div><button id="rst" onclick="toMenu()" title="Voltar à tela inicial">↺ Reiniciar</button><button id="snd" title="Som">🔊</button></div>
<div id="phase"></div>
<main><section class="panel"><h2>📋 Pedidos</h2><div id="olist"></div></section>
<section id="kitchen"><div id="banner"></div><div id="stations"></div><div id="lane"></div><div id="counter"></div></section>
<section class="panel"><h2>📦 Estoque <span id="cash"></span></h2><div class="tip">👇 Quando um item ficar amarelo ou vermelho, clique em COMPRAR. A entrega leva 4s.</div><div id="slist"></div></section></main>
<div id="hint"></div></div>
<div class="ov on" id="ov"></div>
<script>
const $=s=>document.querySelector(s),R=v=>'R$ '+v.toFixed(2).replace('.',',');
const ING={pao:['🍞','Pão',1.5],carne:['🥩','Carne',3],queijo:['🧀','Queijo',2],batata:['🥔','Batata',1.5],fruta:['🍊','Fruta',1.5],emb:['📦','Embalagem',.5]};
const PROD={san:{e:'🥪',n:'Sanduíche',p:10,t:5,r:{pao:1,queijo:1}},ham:{e:'🍔',n:'Hambúrguer',p:12,t:6,r:{pao:1,carne:1}},bat:{e:'🍟',n:'Batata',p:7,t:5,r:{batata:1}},suc:{e:'🥤',n:'Suco',p:5,t:3,r:{fruta:1}}};
const PK=Object.keys(PROD),IK=Object.keys(ING),ST=['Bancada','Chapa','Fritadeira','Bebidas'];
const WK=[{n:'Ana',tag:'Rápida, mas erra mais',sp:.6,err:.18,c:'#ff6b35',e:'👩‍🍳'},{n:'Beto',tag:'Mais lento, mais preciso',sp:1,err:.02,c:'#17b3a3',e:'👨‍🍳'}];
const SCH=[[1,['san'],70],[30,['san','suc'],55],[62,['ham','ham'],55],[78,['ham','bat'],50],[96,['san','bat','suc'],65],[114,['san','suc'],45],[130,['ham','bat'],50],[152,['san','bat','suc'],65],[154,['ham','ham'],55],[156,['san','suc'],50],[178,['suc','suc','bat'],45],[190,['ham','bat','suc'],60],[204,['ham','bat'],45],[216,['san','suc'],40]];
let DUR=240,K=1;const INIT_VAL=47.5;let G,last=0,snd=true,AC,timer;DUR=240;
const cost=p=>Object.entries(PROD[p].r).reduce((a,[k,n])=>a+n*ING[k][2],0);
function beep(f,d=.1,ty='sine'){if(!snd)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
$('#snd').onclick=()=>{snd=!snd;$('#snd').textContent=snd?'🔊':'🔇'};
function init(){G={t:0,run:true,cash:60,rev:0,cost:0,waste:0,pen:0,sat:70,done:0,recv:0,deliv:0,late:0,lost:0,defects:0,outs:0,stock:{pao:6,carne:4,queijo:4,batata:4,fruta:5,emb:10},ready:{san:0,ham:0,bat:0,suc:0},orders:[],oid:0,sel:null,arr:[],sc:0,ev:[0,0,0],ws:WK.map((w,i)=>({st:null,prog:0,busy:0,cur:null,blk:false,slow:1,miss:null})),selW:null,msg:'',msgT:0,osig:'',ssig:''};
buildStatic();$('#banner').textContent='Bem-vindo à Gestão Express!';$('#banner').className=''}
function buildStatic(){$('#stations').innerHTML=PK.map((p,i)=>`<div class="st" data-s="${i}"><div class="e">${PROD[p].e}</div><b>${PROD[p].n}</b><div class="rc">Receita: ${Object.entries(PROD[p].r).map(([k,n])=>ING[k][0]+n).join(' + ')}</div><small id="sn${i}"></small></div>`).join('');
$('#lane').innerHTML=WK.map((w,i)=>`<div class="wk" data-w="${i}" id="w${i}" style="--c:${w.c}"><div class="av">${w.e}</div><b>${w.n}</b><small>${w.tag}</small><div class="pb"><i id="wp${i}"></i></div><small id="wt${i}"></small></div>`).join('')}
function say(m){G.msg=m;G.msgT=3;beep(180,.15,'square')}
function pop(t,c){const d=document.createElement('div');d.className='pop';d.textContent=t;d.style.left=(20+Math.random()*55)+'%';d.style.top='45%';d.style.color=c||'#2a9d4f';$('#kitchen').appendChild(d);setTimeout(()=>d.remove(),1200)}
function can(p){return Object.entries(PROD[p].r).every(([k,n])=>G.stock[k]>=n)}
function need(o){const n={};o.items.forEach(i=>n[i]=(n[i]||0)+1);return n}
function canDel(o){const n=need(o);return PK.every(k=>(n[k]||0)<=G.ready[k])}
function deliver(id){const o=G.orders.find(x=>x.id==id);if(!o)return;if(!canDel(o))return say('Pedido incompleto: faltam itens no balcão!');if(G.stock.emb<1)return say('Sem embalagem! Reponha o estoque 📦');
o.items.forEach(i=>G.ready[i]--);G.stock.emb--;G.cost+=.5;const ok=!o.late,rw=o.price*(ok?1:.5);G.rev+=rw;G.cash+=rw;G.deliv++;if(ok){G.done++;G.sat=Math.min(100,G.sat+4)}
G.orders=G.orders.filter(x=>x!==o);if(G.sel==id)G.sel=null;pop('+'+R(rw),ok?'#2a9d4f':'#c77700');beep(660,.12);beep(880,.15)}
function buy(k){const c=5*ING[k][2];if(G.cash<c)return say('Caixa insuficiente para repor '+ING[k][1]);G.cash-=c;G.purch=(G.purch||0)+c;G.arr.push({k,t:4});beep(440,.08)}
function assign(w,s){const W=G.ws;if(W[w].st===s){W[w].st=null}else{W.forEach(x=>{if(x.st===s)x.st=null});W[w].st=s;beep(520,.08)}G.selW=null}
$('#lane').onclick=e=>{const w=e.target.closest('[data-w]');if(w){const i=+w.dataset.w;G.selW=G.selW===i?null:i;beep(500,.05)}};
$('#stations').onclick=e=>{const s=e.target.closest('[data-s]');if(!s)return;const si=+s.dataset.s;let w=G.selW;if(w===null){w=G.ws.findIndex(x=>x.st===null);if(w<0)return say('Clique em um funcionário primeiro 👆')}assign(w,si)};
$('#olist').onclick=e=>{const d=e.target.closest('[data-d]');if(d)return deliver(d.dataset.d);const o=e.target.closest('[data-o]');if(o){G.sel=G.sel==o.dataset.o?null:+o.dataset.o;beep(500,.05)}};
$('#slist').onclick=e=>{const b=e.target.closest('[data-b]');if(b)buy(b.dataset.b)};
function tick(dt){G.t+=dt;if(G.msgT>0)G.msgT-=dt;
while(G.sc<SCH.length&&SCH[G.sc][0]*K<=G.t){const[,it,dl]=SCH[G.sc++];G.orders.push({id:++G.oid,items:it,dl,left:dl,price:it.reduce((a,i)=>a+PROD[i].p,0),late:false});G.recv++;beep(760,.1,'triangle')}
G.orders.forEach(o=>{o.left-=dt;if(o.left<=0&&!o.late){o.late=true;G.late++;G.sat-=6;G.pen+=3;G.cash-=3;pop('Atrasou! −'+R(3),'#e63946');beep(150,.3,'sawtooth')}});
G.orders=G.orders.filter(o=>{if(o.left<=-15){G.lost++;G.sat-=6;G.pen+=3;G.cash-=3;if(G.sel==o.id)G.sel=null;pop('Cliente desistiu','#e63946');return false}return true});G.sat=Math.max(0,G.sat);
G.arr=G.arr.filter(a=>{a.t-=dt;if(a.t<=0){G.stock[a.k]+=5;pop('+5 '+ING[a.k][0]+' chegou','#17b3a3');return false}return true});
const b=$('#banner');
if(G.t>=150*K&&!G.ev[0]){G.ev[0]=1;b.textContent='🔥 Hora do rush! Vários pedidos chegaram ao mesmo tempo.';b.className='ev'}
if(G.t>=168*K&&!G.ev[1]){G.ev[1]=1;G.stock.carne=0;b.textContent='🚨 Um lote de carne estragou! Decida: repor agora ou priorizar outros pedidos.';b.className='ev';beep(200,.4,'sawtooth')}
if(G.t>=186*K&&!G.ev[2]){G.ev[2]=1;G.ws[0].slow=1.6;b.textContent='😮‍💨 Ana está sobrecarregada e mais lenta. Reorganize a equipe!';b.className='ev'}
if(G.t>=212*K&&G.ws[0].slow>1){G.ws[0].slow=1}
G.ws.forEach((w,i)=>{w.miss=null;if(w.cur){w.prog+=dt/(PROD[w.cur].t*WK[i].sp*w.slow);w.busy+=dt;if(w.prog>=1){const c=cost(w.cur);if(Math.random()<WK[i].err){G.defects++;G.waste+=c;pop('❌ Erro de preparo −'+R(c),'#e63946');beep(160,.25,'square')}else{G.ready[w.cur]++;G.cost+=c;beep(600,.06)}w.cur=null;w.prog=0}}
else if(w.st!==null){const p=PK[w.st];if(G.ready[p]>=3)return;if(can(p)){Object.entries(PROD[p].r).forEach(([k,n])=>G.stock[k]-=n);w.cur=p;w.prog=0;w.blk=false}else{w.miss=Object.keys(PROD[p].r).find(k=>G.stock[k]<PROD[p].r[k]);if(!w.blk){w.blk=true;G.outs++;beep(200,.2,'square')}}}});
if(G.t>=DUR)end()}
function needSet(){const o=G.orders.find(x=>x.id==G.sel)||G.orders[0],s=new Set();if(o){const n=need(o);PK.forEach((p,i)=>{if((n[p]||0)>G.ready[p])s.add(i)})}return s}
function ui(){const lucro=G.rev-G.cost-G.pen-G.waste;$('#kf').textContent=R(G.rev);$('#kp').textContent=R(lucro);$('#kl').className='k'+(lucro<0?' neg':'');$('#ks').textContent=(G.sat>=70?'😀 ':G.sat>=40?'😐 ':'😠 ')+Math.round(G.sat)+'%';$('#kd').textContent=G.done+' pedido'+(G.done==1?'':'s');
const rem=Math.max(0,Math.ceil(DUR-G.t));$('#kt').textContent=Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0');
$('#phase').textContent=G.t<60*K?'Momento 1 · Aprendizado':G.t<150*K?'Momento 2 · Operação':'Momento 3 · Desafio gerencial';
const ns=needSet();PK.forEach((p,i)=>{const el=document.querySelector(`[data-s="${i}"]`),w=G.ws.findIndex(x=>x.st===i),blk=w>=0&&G.ws[w].miss;el.className='st'+(ns.has(i)&&G.ws.every(x=>x.st!==i)?' hl':'')+(blk?' sk':'')+(G.selW!==null&&!blk?' pick':'');$('#sn'+i).textContent=w>=0?(blk?'Falta '+ING[blk][1]:'Com '+WK[w].n):'Sem funcionário'});
G.ws.forEach((w,i)=>{const el=$('#w'+i);el.style.left=(w.st!==null?w.st*25+12.5:i?88:12)+'%';el.style.top=(w.st!==null?0:84)+'px';el.className='wk'+(G.selW===i?' sel':'')+(w.cur?' on':'');$('#wp'+i).style.width=(w.prog*100)+'%';
$('#wt'+i).textContent=w.cur?'Preparando '+PROD[w.cur].e:w.miss?'Sem '+ING[w.miss][1]+'!':w.st!==null?(G.ready[PK[w.st]]>=3?'Bandeja cheia':'Pronto'):'Livre: clique e escolha estação'});
$('#counter').innerHTML='🛎️ Balcão de entrega: '+PK.map(p=>`${PROD[p].e} ×${G.ready[p]}`).join(' &nbsp; ');
$('#cash').textContent='Caixa '+R(G.cash);
const os=JSON.stringify([G.orders.map(o=>[o.id,o.late]),G.ready,G.sel,G.stock.emb>0]);

const d1=bal>.3?'Você distribuiu as tarefas entre os funcionários e manteve a produção fluindo.':'Um funcionário trabalhou muito mais que o outro. Distribuir as tarefas reduz o tempo de espera.';
const d1b=G.defects>=2?` Houve ${G.defects} produto(s) perdido(s) por erro: velocidade e qualidade precisam de equilíbrio.`:'';
const d2=G.outs>=3?`Faltaram ingredientes ${G.outs} vezes e a produção parou. Planejar a reposição com antecedência evita atrasos.`:exc>10?`Você comprou ingredientes em excesso (${R(exc)} parados em estoque), o que reduz o lucro.`:'Você manteve o estoque equilibrado: poucas faltas e sem excessos.';

let ONLINE=false;
const LS=()=>{try{return JSON.parse(localStorage.getItem('gx_rank')||'[]')}catch(e){return[]}},sv=r=>{try{localStorage.setItem('gx_rank',JSON.stringify(r))}catch(e){}};
async function api(m,b,h){const r=await fetch('/api/rank',{method:m,headers:{'content-type':'application/json',...h},body:b?JSON.stringify(b):undefined,signal:AbortSignal.timeout(4000)});if(!r.ok)throw 0;return r.json()}
async function ld(){try{const r=await api('GET');if(Array.isArray(r)){ONLINE=true;return r}}catch(e){}ONLINE=false;return LS()}
async function add(ent){if(ONLINE){try{return (await api('POST',ent)).id}catch(e){ONLINE=false}}ent.id=Date.now();const a=LS();a.push(ent);a.sort((x,y)=>y.l-x.l);sv(a.slice(0,100));return ent.id}
const hs=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h};
async function resetRank(){const p=prompt('Senha para resetar o ranking:');if(p===null)return;if(ONLINE){try{await api('DELETE',null,{'x-password':p})}catch(e){alert('Senha incorreta ou servidor indisponível.');return}}else{if(hs(p)!==2225461199){alert('Senha incorreta.');return}sv([])}showRank(BACK)}
function rankHTML(l,me,n){const r=[...l].sort((a,b)=>b.l-a.l).slice(0,n);return r.length?`<table class="rk">${r.map((e,i)=>`<tr class="${e.id===me?'me':''}"><td>${['🥇','🥈','🥉'][i]||(i+1)+'º'}</td><td>${esc(e.n)}</td><td>${e.m} min</td><td>${R(e.l)}</td></tr>`).join('')}</table>`:'<p>Ainda não há partidas. Seja o primeiro! 🚀</p>'}
async function showRank(b){BACK=b;$('#ov').className='ov on';$('#ov').innerHTML='<div class="card"><h1>🏆 Ranking de lucro</h1><p>Carregando…</p></div>';const l=await ld();$('#ov').innerHTML=`<div class="card">${lg(70)}<h1>🏆 Ranking de lucro</h1>${rankHTML(l,G&&G.eid||0,10)}<p style="font-size:13px">${ONLINE?'🌐 Ranking online, compartilhado entre todos os computadores.':'💾 Sem conexão com o servidor: ranking salvo só neste computador.'}</p><button class="big" onclick="BACK()">Voltar</button><button class="big" style="background:#8a82a8;box-shadow:0 5px 0 #5f5880" onclick="resetRank()">🔒 Resetar ranking</button></div>`}
function setDur(m){DUR=m*60;K=DUR/240;renderOpt()}
function renderOpt(){const o=$('#opt');if(o)o.innerHTML=[3,4,5].map(m=>`<button class="${DUR==m*60?'on':''}" onclick="setDur(${m})">${m} min</button>`).join('')}
function toMenu(){clearInterval(timer);if(G)G.run=false;init();intro();renderOpt();$('#ov').className='ov on'}
